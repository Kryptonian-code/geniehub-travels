<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenieHub</title>
    <meta
      name="description"
      content="GenieHub helps clients book consultations, track applications, upload documents, and manage travel operations in one workspace."
    />
    <meta name="author" content="GenieHub" />
    <meta property="og:title" content="GenieHub" />
    <meta
      property="og:description"
      content="Client authentication, progress tracking, document uploads, and admin operations for travel services."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GenieHub" />
    <meta
      name="twitter:description"
      content="Client authentication, progress tracking, document uploads, and admin operations for travel services."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #062f26;
        color: #f5f3ed;
        font-family: Montserrat, system-ui, sans-serif;
      }
      .boot-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #062f26;
      }
      .boot-loader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .boot-loader__ring {
        position: relative;
        width: 56px;
        height: 56px;
      }
      .boot-loader__ring::before,
      .boot-loader__ring::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
      }
      .boot-loader__ring::before {
        border: 1px solid rgba(20, 92, 77, 0.9);
        animation: bootPulse 1.8s ease-in-out infinite;
      }
      .boot-loader__ring::after {
        inset: 7px;
        border: 2px solid transparent;
        border-top-color: #d7c7a3;
        border-right-color: #11806a;
        animation: bootSpin 1.1s linear infinite;
      }
      .boot-loader__mark {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #d7c7a3;
        font-weight: 700;
        font-size: 22px;
      }
      .boot-loader__text {
        text-align: center;
      }
      .boot-loader__title {
        font-size: 1.15rem;
        font-weight: 700;
      }
      .boot-loader__caption {
        margin-top: 4px;
        font-size: 0.85rem;
        color: #b7c9c2;
      }
      @keyframes bootSpin { to { transform: rotate(360deg); } }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); opacity: .35; }
        50% { transform: scale(1.18); opacity: .7; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-loader" aria-live="polite" aria-busy="true">
        <div class="boot-loader__inner">
          <div class="boot-loader__ring"><span class="boot-loader__mark">G</span></div>
          <div class="boot-loader__text">
            <div class="boot-loader__title">Loading GenieHub</div>
            <div class="boot-loader__caption">Preparing your workspace and travel tools.</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
